name: Release

# Pushing a tag like v3.1.0 publishes the GitHub release for it. The notes
# come from .github/release-notes/<tag>.md when that file exists, otherwise
# from the version's section of CHANGELOG.md.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  NAME: ReForgeTopGG

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the package.json version $version"
            exit 1
          fi
      - name: Write the release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -f ".github/release-notes/$GITHUB_REF_NAME.md" ]; then
            cp ".github/release-notes/$GITHUB_REF_NAME.md" notes.md
          else
            awk -v h="## $version" 'index($0, h " ") == 1 || $0 == h { found = 1; next } found && /^## / { exit } found { print }' CHANGELOG.md > notes.md
          fi
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::No release notes for $GITHUB_REF_NAME (no .github/release-notes/$GITHUB_REF_NAME.md and no \"## $version\" section in CHANGELOG.md)"
            exit 1
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "The release $GITHUB_REF_NAME already exists; leaving it as it is."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --title "$NAME $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
