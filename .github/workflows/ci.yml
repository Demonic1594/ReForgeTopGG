name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Builds dist/, then runs every test file. Top.gg is never contacted.
      - run: npm test
      - run: npm run docgen
      # dist/ and metadata/ are committed so the package installs straight
      # from GitHub; fail if they don't match the sources.
      - name: Check that dist/ and metadata/ are up to date
        if: matrix.node == 22
        run: git diff --exit-code -- dist metadata

  forgescript-compat:
    # The lowest ForgeScript the peer range allows.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i --no-save @tryforge/forgescript@2.5.0
      - run: npm test
